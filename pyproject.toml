[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clusterfed"
version = "0.2.0"
description = "ClusterFed v2: clustering-bootstrapped, confidence-refined federated pseudo-labeling for zero-day attack detection (CICIDS2017 / CSE-CIC-IDS2018)"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "torch",
    "matplotlib",
    "pyyaml",
    "tqdm",
    "scipy",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
